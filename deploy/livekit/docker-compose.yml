# LiveKit self-hosted — Docker Compose completo para QuickVoice
# Incluye: LiveKit Server (WebRTC) + LiveKit SIP (telefonía) + Redis
# ---------------------------------------------------------------
# Uso:
#   1. Genera claves:  openssl rand -hex 16  y  openssl rand -hex 32
#   2. Copia config.example.yaml → config.yaml  y  pon tus claves en keys:
#   3. Copia sip-config.example.yaml → sip-config.yaml  y pon tus claves
#   4. docker compose up -d
#   5. Configura en apps/server/.env:
#        LIVEKIT_URL=ws://TU_SERVIDOR:7880
#        LIVEKIT_API_KEY=TU_API_KEY
#        LIVEKIT_API_SECRET=TU_API_SECRET
#        LIVEKIT_SIP_INBOUND_TRUNK_ID=ST_xxx   (provisiona con scripts/provision-trunks.ts)

services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: always
    network_mode: host
    volumes:
      - ./config.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  livekit-sip:
    image: livekit/sip:latest
    container_name: livekit-sip
    restart: always
    network_mode: host
    volumes:
      - ./sip-config.yaml:/etc/livekit-sip.yaml:ro
    command: --config /etc/livekit-sip.yaml
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: livekit-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
